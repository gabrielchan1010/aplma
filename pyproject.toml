[project]
name = "aplma"
version = "0.1.0"
description = "Covenant extraction + review report for facility agreements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.58.0",
    "google-genai>=1.0.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "ipywidgets>=8.0.0",
    "jupyterlab>=4.0.0",
    "pytest>=8.3.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aplma"]

[tool.hatch.build.targets.wheel.force-include]
"aplma/specs/financial_indebtedness.yaml" = "aplma/specs/financial_indebtedness.yaml"
